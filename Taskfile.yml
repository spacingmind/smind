version: "3"

tasks:
  build:
    desc: Build web UI then the smind binary
    deps: [build:web]
    cmds:
      # Version signal (AC2): <manifest> at a release tag (v<manifest>),
      # otherwise <manifest>-dev+<shortsha>, plus .dirty when build inputs are unclean.
      # Backticks, not $(...): go-task's shell parser rejects $( ) in cmds.
      - |
        v=`grep -o '"[^"]*"' .release-please-manifest.json | sed -n 2p | tr -d '"'`
        short=`git rev-parse --short HEAD`
        tag=`git describe --exact-match --tags HEAD 2>/dev/null || true`
        if [ "$tag" != "v$v" ]; then
          v="$v-dev+$short"
          # Only paths that end up in the binary count: untracked files
          # elsewhere (a stray root package.json, node_modules) aren't part of
          # the build, but an untracked .go file under cmd/ or internal/ is.
          if [ -n "`git status --porcelain -- cmd internal web/packages go.mod go.sum`" ]; then v="$v.dirty"; fi
        fi
        echo "building smind $v ($short)"
        go build -buildvcs=false -ldflags "-X github.com/spacingmind/smind/internal/version.Version=$v -X github.com/spacingmind/smind/internal/version.Commit=$short" -o bin/smind ./cmd/smind

  build:web:
    desc: Build the web UI into internal/server/dist
    dir: web
    cmds:
      - bun install
      - bun run --filter '@smind/ui' build
    sources:
      - "packages/ui/src/**/*"
      - "packages/ui/*.{json,ts,html}"
    generates:
      - "../internal/server/dist/**/*"

  dev:go:
    desc: Run the Go daemon with auto-reload
    cmds:
      - go run github.com/air-verse/air@v1.67.4 -c .air.toml

  dev:web:
    desc: Vite dev server proxying API to :4648
    dir: web/packages/ui
    cmds:
      - bun run dev

  dev:
    desc: Run the Go daemon and Vite dev server with hot reload
    cmds:
      - |
        bash -c '
          set -eu
          go_pid=
          web_pid=

          cleanup() {
            trap - EXIT INT TERM
            for pid in "$go_pid" "$web_pid"; do
              if [ -n "$pid" ]; then
                kill -TERM -- "-$pid" 2>/dev/null || true
              fi
            done
            for pid in "$go_pid" "$web_pid"; do
              if [ -n "$pid" ]; then
                wait "$pid" 2>/dev/null || true
              fi
            done
          }

          trap cleanup EXIT INT TERM
          setsid task dev:go &
          go_pid=$!
          setsid task dev:web &
          web_pid=$!
          wait "$go_pid"
        '

  test:
    desc: Run Go and web tests
    deps: [test:web]
    cmds:
      - go test ./...

  test:web:
    desc: Run the web UI's test suite
    dir: web
    cmds:
      - bun install
      - bun run --filter '@smind/ui' test

  lint:
    desc: Vet + gofmt check
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l $(git ls-files '*.go'))"

  check:versions:
    desc: Verify the four desktop version fields match the release manifest
    cmds:
      - ./scripts/check-version-sync.sh

  desktop:mac:
    desc: Build the unsigned macOS app (smind.app + .dmg) for the host arch, daemon bundled (TARGET=x86_64-apple-darwin to cross-build)
    platforms: [darwin]
    deps: [build:web]
    vars:
      TARGET: '{{.TARGET | default (ternary "aarch64-apple-darwin" "x86_64-apple-darwin" (eq ARCH "arm64"))}}'
    cmds:
      # The bundled daemon is the same release as the app: stamp it with the
      # desktop version (tauri.conf.json, kept equal to the release manifest
      # by `task check:versions`), not the `-dev+<sha>` the plain `task build`
      # uses, so /healthz reports exactly the app's version. Same flags as the
      # release build otherwise (CGO off, web UI embedded by `build:web`).
      - |
        set -eu
        v=`jq -r .version desktop/src-tauri/tauri.conf.json`
        short=`git rev-parse --short HEAD`
        case "{{.TARGET}}" in
          aarch64-apple-darwin) goarch=arm64 ;;
          x86_64-apple-darwin) goarch=amd64 ;;
          *) echo "unsupported TARGET {{.TARGET}}" >&2; exit 1 ;;
        esac
        mkdir -p desktop/src-tauri/binaries
        echo "building bundled smind $v ($short) for darwin/$goarch"
        CGO_ENABLED=0 GOOS=darwin GOARCH=$goarch go build -buildvcs=false -ldflags "-X github.com/spacingmind/smind/internal/version.Version=$v -X github.com/spacingmind/smind/internal/version.Commit=$short" -o desktop/src-tauri/binaries/smind-{{.TARGET}} ./cmd/smind
      - cd desktop && npm ci && npx tauri build --target {{.TARGET}}
      - |
        echo "built:"
        ls -d desktop/src-tauri/target/{{.TARGET}}/release/bundle/macos/*.app desktop/src-tauri/target/{{.TARGET}}/release/bundle/dmg/*.dmg

  desktop:mac:install:
    desc: Build (if needed) and copy smind.app into /Applications, replacing any previous copy
    platforms: [darwin]
    vars:
      TARGET: '{{.TARGET | default (ternary "aarch64-apple-darwin" "x86_64-apple-darwin" (eq ARCH "arm64"))}}'
    cmds:
      - task: desktop:mac
        vars: { TARGET: "{{.TARGET}}" }
      - |
        set -eu
        if pgrep -x smind-desktop >/dev/null; then
          echo "smind is running -- quit it (Cmd+Q) before replacing /Applications/smind.app" >&2
          exit 1
        fi
        rm -rf /Applications/smind.app
        # ditto keeps the bundle's signature/xattrs intact; a locally built
        # app carries no com.apple.quarantine, so it opens without a
        # Gatekeeper prompt. -cr is a belt-and-braces clear, not a fix.
        ditto desktop/src-tauri/target/{{.TARGET}}/release/bundle/macos/smind.app /Applications/smind.app
        xattr -cr /Applications/smind.app
        echo "installed /Applications/smind.app"

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy
