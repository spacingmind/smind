// relay.proto — smind relay wire contract (daemon ↔ relay, ADR-0007 (f)).
//
// The relay is a dumb pipe: it authenticates connections (ADR-0011) and
// forwards opaque ciphertext frames between a daemon and its paired mobile
// devices. It never sees an E2EE session key and cannot inspect Frame
// payloads.
//
// Control/data socket mapping (ADR-0007 (b), decided here as the ADR left
// it to this plan):
//
//   - Control socket  -> OpenControl, one bidi stream per daemon↔relay
//     connection. It owns connection/session lifecycle: device attach and
//     detach announcements, liveness, and (later) buffer/ack bookkeeping.
//     It carries no application payload.
//   - Data socket     -> OpenData, one bidi stream per paired device per
//     E2EE session — opened by the daemon for each device and by the mobile
//     device itself, so fanout is "one stream per device" rather than a
//     shared pipe needing multiplexing. Each Frame is a self-contained
//     envelope (routing metadata + opaque ciphertext), which is also what
//     the reconnect buffer (ADR-0007 (a)) stores and flushes on reconnect.
//
// A single multiplexed stream carrying a tagged envelope for both control
// and data was considered and rejected: it reintroduces exactly the ad hoc
// multiplexing the control/data split exists to avoid, and control liveness
// would then share flow control with bulk ciphertext.
//
// Relay admission (ADR-0011) is deliberately unary and separate from both
// streams: AdmitChallenge issues a server nonce, then Admit carries the
// daemon's SCRAM-style proof over the transcript (protocol version,
// relay host id, both nonces, daemon key ID). The raw relay host secret never
// appears on the wire, and the hash the relay stores is not sufficient to
// forge the proof. A connection is bound to one relay host; Frames whose
// relay host or session ID mismatch the binding are rejected by the relay
// implementation (not the wire contract). Admission is independent of the E2EE handshake,
// which happens inside the encrypted payload the relay forwards blindly.

syntax = "proto3";

package relay.v1;

option go_package = "github.com/spacingmind/smind/internal/relay/relaypb";

// Relay is the daemon/mobile-facing service a self-hosted `smind relay`
// exposes. Every RPC runs over pinned TLS (ADR-0011); the E2EE handshake
// and session traffic ride inside OpenData's opaque payloads.

service Relay {
  // Step 1 of admission: the daemon requests a server nonce for the
  // challenge transcript. Unknown relay host ids are answered with a nonce
  // anyway (verification happens in Admit) to avoid an oracle for which
  // relay hosts exist.
  rpc AdmitChallenge(AdmitChallengeRequest) returns (AdmitChallengeResponse);

  // Step 2 of admission: the daemon proves possession of the workspace
  // secret with a SCRAM-style proof over the transcript (protocol version,
  // workspace_id, client nonce, server nonce, daemon key ID); see
  // AdmitRequest.hmac. On success the relay binds the connection's gRPC
  // context to that workspace.
  rpc Admit(AdmitRequest) returns (AdmitResponse);

  // Control socket (ADR-0007 (b)): one persistent bidi stream per daemon.
  // Session and device lifecycle only — never application payload.
  rpc OpenControl(stream ControlFrame) returns (stream ControlFrame);

  // Data socket (ADR-0007 (b)): one bidi stream per paired device,
  // carrying opaque ciphertext envelopes both directions. The relay
  // forwards, buffers (bounded), and evicts; it never decrypts.
  rpc OpenData(stream Frame) returns (stream Frame);
}

// --- Admission (ADR-0011) ---

message AdmitChallengeRequest {
  // Protocol version of the admission state machine. v2 = SCRAM-style
  // proof; v1 (HMAC keyed by the stored hash) is rejected.
  uint32 protocol_version = 1;
  // Relay host id the connection wants to be bound to.
  string workspace_id = 2;
  // Fresh random nonce generated by the daemon for this transcript.
  bytes client_nonce = 3;
  // Stable identifier of the daemon's persisted keypair (ADR-0007 (g)).
  string daemon_key_id = 4;
}

message AdmitChallengeResponse {
  // Fresh random nonce generated by the relay for this transcript. May be
  // issued even for unknown relay hosts; see AdmitChallenge.
  bytes server_nonce = 1;
}

message AdmitRequest {
  // Same values as the AdmitChallengeRequest that obtained the nonce.
  uint32 protocol_version = 1;
  string workspace_id = 2;
  bytes client_nonce = 3;
  string daemon_key_id = 4;
  bytes server_nonce = 5;
  // SCRAM-style proof (RFC 5802 idea), 32 bytes:
  //   ClientKey = the raw relay host secret
  //   StoredKey = SHA-256(ClientKey)        (all the relay persists)
  //   proof     = ClientKey XOR HMAC-SHA256(StoredKey, transcript)
  // where transcript = protocol_version (4 bytes BE) || LP(workspace_id) ||
  // client_nonce || server_nonce || LP(daemon_key_id) and LP(s) is a
  // 4-byte BE length prefix plus the bytes. The relay recovers ClientKey
  // from the proof and accepts iff SHA-256(recovered) == StoredKey, so
  // holding only the stored hash cannot forge a proof. The secret itself
  // is never sent. The field keeps its original name "hmac" (field number
  // 6 and bytes type are unchanged); it carries the proof, not a bare MAC.
  bytes hmac = 6;
}

message AdmitResponse {
  // Opaque handle naming the admitted (host-bound) session context;
  // presented on subsequent streams. Not a credential — streams are still
  // bound to the relay host by the admission on their connection.
  bytes admission_id = 1;
}

// --- Control channel ---

message ControlFrame {
  // DeviceAttach (relay -> daemon): a device-side data stream attached to a
  // route that has no daemon side yet. The daemon answers by opening the
  // daemon side of that route (OpenData, DIRECTION_DAEMON_TO_DEVICE) with the
  // same (device_id, session_id). Older daemons ignore it.
  message DeviceAttach {
    // Device ID of the attached route (Frame.device_id).
    string device_id = 1;
    // The device's persisted public key material as offered at pairing,
    // opaque to the relay's control logic. Unused by the relay (kept).
    bytes pairing_payload = 2;
    // E2EE session id of the attached route (Frame.session_id).
    bytes session_id = 3;
  }

  // DeviceDetach (relay -> daemon): the route's device side ended and no
  // daemon side is attached, or the route was garbage-collected.
  message DeviceDetach {
    string device_id = 1;
    bytes session_id = 2;
  }

  message Ping {
    // Monotonic control-sequence number for liveness/ordering.
    uint64 sequence = 1;
  }

  message Pong {
    uint64 sequence = 1;
  }

  // DeviceRef names one route of the control stream's relay host.
  message DeviceRef {
    string device_id = 1;
    bytes session_id = 2;
  }

  // Sync (relay -> daemon): every route with a live device side and no
  // daemon side. Sent once, right after a control stream is accepted, so a
  // daemon that (re)connects learns about devices that attached while it
  // was away.
  message Sync {
    repeated DeviceRef devices = 1;
  }

  // Revoke (daemon -> relay): close this device's streams and refuse new
  // attaches for it until the control stream ends (best effort; the daemon
  // stays authoritative and rejects the device itself).
  message Revoke {
    string device_id = 1;
  }

  // Relay host id the control connection is bound to; must match the
  // authenticated admission binding or the relay rejects the stream.
  string workspace_id = 1;

  oneof body {
    DeviceAttach device_attach = 2;
    DeviceDetach device_detach = 3;
    Ping ping = 4;
    Pong pong = 5;
    Sync sync = 6;
    Revoke revoke = 7;
  }
}

// --- Data channel ---

// Direction of a frame's travel. The relay uses it (with session_id) to
// route and to enforce the authenticated relay host binding; the E2EE
// session's own directional keys (see internal/relay/e2ee) make a frame
// unusable in the wrong direction regardless.
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  // Daemon -> device.
  DIRECTION_DAEMON_TO_DEVICE = 1;
  // Device -> daemon.
  DIRECTION_DEVICE_TO_DAEMON = 2;
}

// Frame is the envelope the relay stores, buffers, and forwards. Payload
// is opaque ciphertext (E2EE-wrapped application or handshake bytes);
// sequence mirrors the E2EE per-direction counter (ADR-0007 (c)/(d)) so the
// relay can order buffered frames on flush.
message Frame {
  // Relay host binding; must match the connection's admitted relay host.
  string workspace_id = 1;
  // E2EE session identifier (fresh per handshake, ADR-0007 (e)).
  bytes session_id = 2;
  // Paired device this frame is routed to/from.
  string device_id = 3;
  // Direction of travel, for routing and binding enforcement.
  Direction direction = 4;
  // Per-direction monotonic counter from the E2EE session.
  uint64 sequence = 5;
  // Opaque ciphertext. The relay has no key for this and must not attempt
  // to inspect it.
  bytes payload = 6;
  // Application-level liveness probe (ADR-0031 D9, flow 8). A frame with
  // keepalive set is consumed by the relay and answered with a keepalive
  // frame on the same stream; it is never forwarded to the peer and never
  // buffered, and it carries no payload. Peers that predate this field
  // never set it.
  bool keepalive = 7;
}
