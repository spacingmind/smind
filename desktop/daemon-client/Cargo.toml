[package]
name = "smind-daemon-client"
version = "0.1.0"
edition = "2021"
description = "Pure-logic daemon client for the smind desktop shell (no GUI deps, tests run without webkit)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["rt", "time", "macros", "net", "sync"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.4"
base64 = "0.23"
tonic = { version = "0.14.6", features = ["transport"] }
prost = "0.14.4"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.0"
tower = { version = "0.5.3", features = ["util"] }
hyper-util = { version = "0.1.21", features = ["client", "tokio"] }
http = "1.5.0"
tonic-prost = "0.14.6"
async-trait = "0.1.92"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tonic-prost-build = "0.14.6"
