[package]
name = "smind-daemon-client"
version = "0.1.0"
edition = "2021"
description = "Pure-logic daemon client for the smind desktop shell (no GUI deps, tests run without webkit)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["rt", "time", "macros", "net", "sync"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.4"
base64 = "0.23"

[dev-dependencies]
tempfile = "3"
