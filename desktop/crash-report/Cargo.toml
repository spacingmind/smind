[package]
name = "smind-crash-report"
version = "0.1.0"
edition = "2021"
description = "Local, redacted, bounded crash reports for the smind desktop shell (no GUI deps, tests run in seconds)"
publish = false

# Only serde_json and regex: both are already in the shell's lock file through Tauri, and nothing here
# touches the network or spawns a process (docs/plans/active/crash-capture-desktop.md).
[dependencies]
serde_json = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"

# A helper process for tests/hook.rs (the panic hook is process-global and the main thread is
# not a test-harness thread). Never linked into the shell.
[[bin]]
name = "crash-child"
path = "src/bin/crash_child.rs"
