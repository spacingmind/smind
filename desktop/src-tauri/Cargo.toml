[package]
name = "smind-desktop"
version = "0.14.0" # x-release-please-version
description = "smind desktop thin-client shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
smind-daemon-client = { path = "../daemon-client" }
tokio = { version = "1", features = ["rt", "time", "sync"] }
rust-embed = { version = "8.12.0", default-features = false, features = ["mime-guess"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.23"
semver = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

# desktop-macos-app M3.4: the notification plugin has no click callback on
# desktop, so macOS drives NSUserNotification directly (the same crate the
# plugin's own backend already pulls in) to get "clicked" back.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[dev-dependencies]
tempfile = "3"
# ADR-0023 updater e2e: the mock runtime, a throwaway signing key, a fake
# .app.tar.gz.
tauri = { version = "2", features = ["test"] }
minisign = "0.10"
flate2 = "1"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# real_daemon_test (opt-in e2e): the same crates daemon-client already uses.
futures-util = "0.3"
tokio-tungstenite = "0.30"

[lib]
name = "smind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
