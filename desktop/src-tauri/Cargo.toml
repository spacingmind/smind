[package]
name = "smind-desktop"
version = "0.1.0"
description = "smind desktop thin-client shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = ["tray-icon"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
url = "2"
smind-daemon-client = { path = "../daemon-client" }

[lib]
name = "smind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
