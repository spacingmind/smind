name: desktop-windows

# Builds the Tauri desktop thin client for Windows (NSIS .exe + .msi) and
# uploads the installers as a workflow artifact. Windows code signing
# (Authenticode) is out of scope. The *updater* artifacts (the NSIS
# *-setup.exe + its .exe.sig, minisign-signed with the
# TAURI_SIGNING_PRIVATE_KEY secret) are built only when that secret is
# present, via tauri build --config src-tauri/tauri.updater.conf.json
# (ADR-0023.4); PR/fork/manual builds have no secret and skip them. No
# release is published here -- release-please.yml calls this as a reusable
# workflow (workflow_call) to attach the installers to an actual GitHub
# Release. See docs/plans/completed/desktop-tauri-shell.md and
# docs/plans/completed/release-binaries.md.
#
# The installers bundle the matching windows/amd64 `smind.exe` (tauri.windows
# .conf.json externalBin; ADR-0030 amendment, docs/plans/active/
# windows-bundled-daemon.md). When called from release-please.yml it reuses
# that run's `smind_<version>_windows_amd64` artifact (`daemon-version`
# input); on a push/PR/manual run there is no such artifact, so it builds the
# daemon itself with `task desktop:win:daemon`, as desktop-macos.yml does.
on:
  push:
    paths:
      - "desktop/**"
      - "web/packages/ui/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      daemon-version:
        description: >-
          Version of the already-built smind_<version>_windows_amd64 artifact
          in this run to bundle. Empty builds the daemon here instead.
        type: string
        required: false
        default: ""
      require-updater-signing:
        description: >-
          Fail the build when TAURI_SIGNING_PRIVATE_KEY is absent instead of
          silently producing a release that can't self-update.
        type: boolean
        required: false
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Minisign private key for updater artifact signing.
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: Password for the updater signing key (empty = none).
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # AC1: beforeBuildCommand builds web/packages/ui (VITE_SMIND_DESKTOP=1)
      # with bun before rust-embed embeds it into the binary.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      # Release path: reuse the daemon this run's build-binaries job already
      # built (same ldflags/version as the GitHub Release asset).
      - name: Download bundled daemon
        if: inputs.daemon-version != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smind_${{ inputs.daemon-version }}_windows_amd64
          path: daemon

      - name: Stage bundled daemon from the release build
        if: inputs.daemon-version != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem daemon -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw 'no windows_amd64 zip in the downloaded daemon artifact' }
          Expand-Archive $zip.FullName -DestinationPath daemon/extracted
          if (-not (Test-Path daemon/extracted/smind.exe)) { throw 'smind.exe not at archive root' }
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item daemon/extracted/smind.exe desktop/src-tauri/binaries/smind-x86_64-pc-windows-msvc.exe

      # PR / push / manual path: no release artifact exists, so build it here.
      - name: Mark repo safe for git
        if: inputs.daemon-version == ''
        run: git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: inputs.daemon-version == ''
        with:
          go-version-file: go.mod

      - name: Build bundled daemon
        if: inputs.daemon-version == ''
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @go-task/cli
          task desktop:win:daemon

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci

      # The Windows host code (daemon_manager.rs, windows_native.rs) only
      # compiles and runs here; the sidecar is staged above, so the install
      # tests see the same layout the installer ships.
      - name: cargo test (desktop shell)
        working-directory: desktop/src-tauri
        run: cargo test

      - name: cargo test (daemon client)
        working-directory: desktop/daemon-client
        run: cargo test

      # The secret is exposed only here and only in the build step's env --
      # never to other steps or third-party actions. The script prints
      # sign=true/sign=false (or fails when require-updater-signing is set)
      # without echoing the key.
      - name: Decide updater signing
        id: sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          REQUIRE_UPDATER_SIGNING: ${{ inputs.require-updater-signing }}
        run: desktop/scripts/updater-signing-mode.sh >> "$GITHUB_OUTPUT"

      - name: Build installers
        if: steps.sign.outputs.sign != 'true'
        working-directory: desktop
        run: npx tauri build

      - name: Build installers (with updater artifacts)
        if: steps.sign.outputs.sign == 'true'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/tauri.updater.conf.json

      # AC5 (windows-bundled-daemon): the installers must really carry the
      # daemon. Extract the NSIS installer (7-Zip reads NSIS) and the MSI
      # (administrative install) and require a non-placeholder smind.exe
      # that is byte-identical to the staged sidecar and reports the app's
      # version. Runs on the build runner (x64), so the daemon can be run.
      - name: Verify installers bundle smind.exe
        shell: pwsh
        env:
          DAEMON_VERSION: ${{ inputs.daemon-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $appVersion = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $staged = 'desktop/src-tauri/binaries/smind-x86_64-pc-windows-msvc.exe'
          $stagedHash = (Get-FileHash $staged -Algorithm SHA256).Hash
          $bundle = 'desktop/src-tauri/target/release/bundle'

          function Assert-Bundled($name, $root) {
            $found = @(Get-ChildItem $root -Recurse -Filter smind.exe -File)
            if ($found.Count -eq 0) {
              Get-ChildItem $root -Recurse -File | Select-Object -ExpandProperty FullName | Write-Host
              throw "$name does not contain smind.exe"
            }
            foreach ($f in $found) {
              Write-Host "${name}: $($f.FullName) ($($f.Length) bytes)"
              if ($f.Length -lt 1MB) { throw "$name smind.exe is $($f.Length) bytes -- a placeholder, not a daemon" }
              $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
              if ($h -ne $stagedHash) { throw "$name smind.exe sha256 $h != staged sidecar $stagedHash" }
            }
          }

          $nsis = Get-ChildItem "$bundle/nsis" -Filter *-setup.exe | Select-Object -First 1
          if (-not $nsis) { throw 'no NSIS *-setup.exe built' }
          7z x $nsis.FullName "-overify/nsis" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z could not extract $($nsis.Name)" }
          Assert-Bundled 'NSIS installer' 'verify/nsis'

          $msi = Get-ChildItem "$bundle/msi" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'no MSI built' }
          New-Item -ItemType Directory -Force verify/msi | Out-Null
          $target = (Resolve-Path verify/msi).Path
          $p = Start-Process msiexec -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$target`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a exited $($p.ExitCode)" }
          Assert-Bundled 'MSI' 'verify/msi'

          # The bundled daemon reports the app's version. A manual dry run of
          # the release workflow stamps `<x>-dev+<sha>`; every other build
          # must match the app version exactly.
          $out = & $staged version
          Write-Host "bundled daemon: $out"
          if ($env:DAEMON_VERSION -notlike '*-dev*' -and -not ($out -match [regex]::Escape($appVersion))) {
            throw "bundled daemon '$out' does not report app version $appVersion"
          }

      # Stage into a flat dir: uploading the nsis/*.exe and msi/*.msi globs
      # directly preserves those two subdirectories in the artifact, which
      # breaks release-please.yml's flat *.exe/*.msi glob after it merges
      # this artifact in with the daemon tarballs.
      - name: Stage installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe dist/
          cp desktop/src-tauri/target/release/bundle/msi/*.msi dist/

      # Updater asset for Windows is the NSIS *-setup.exe (not the .msi);
      # stage its .exe.sig next to the already-staged installer.
      - name: Stage updater signature
        if: steps.sign.outputs.sign == 'true'
        shell: bash
        run: |
          set -euo pipefail
          setup_exe="$(compgen -G 'dist/*-setup.exe')"
          [ -n "$setup_exe" ] || { echo "::error::no *-setup.exe staged in dist"; exit 1; }
          sig="desktop/src-tauri/target/release/bundle/nsis/$(basename "$setup_exe").sig"
          [ -f "$sig" ] || { echo "::error::expected updater signature $sig is missing"; exit 1; }
          cp "$sig" dist/
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smind-desktop-windows
          path: dist/*
          if-no-files-found: error
