name: desktop-windows

# Builds the Tauri desktop thin client for Windows (NSIS .exe + .msi) and
# uploads the installers as a workflow artifact. Unsigned; no release is
# published here -- release-please.yml calls this as a reusable workflow
# (workflow_call) to attach the installers to an actual GitHub Release. See
# docs/plans/active/desktop-tauri-shell.md and
# docs/plans/completed/release-binaries.md.
on:
  push:
    paths:
      - "desktop/**"
      - "web/packages/ui/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # AC1: beforeBuildCommand builds web/packages/ui (VITE_SMIND_DESKTOP=1)
      # with bun before rust-embed embeds it into the binary.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Build installers
        working-directory: desktop
        run: npx tauri build

      # Stage into a flat dir: uploading the nsis/*.exe and msi/*.msi globs
      # directly preserves those two subdirectories in the artifact, which
      # breaks release-please.yml's flat *.exe/*.msi glob after it merges
      # this artifact in with the daemon tarballs.
      - name: Stage installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe dist/
          cp desktop/src-tauri/target/release/bundle/msi/*.msi dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smind-desktop-windows
          path: dist/*
          if-no-files-found: error
