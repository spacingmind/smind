name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  # GitHub merge queue (develop ruleset): the required `ci` check must also
  # run on the queue's temporary merge-group branch, or queued PRs never merge.
  merge_group:

permissions:
  contents: read

jobs:
  windows-terminal:
    # Already ran on the PR and is not a required check; skipping it in the
    # merge queue keeps each queued batch to the ~2-3 min `ci` job.
    if: github.event_name != 'merge_group'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Mark repo safe for git
        run: git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test terminal package
        run: go test -v ./internal/terminal/...

      # The full Windows suite (still mostly red: daemon runtime parity is
      # follow-up work) runs nightly and on demand in windows-full-suite.yml,
      # not here -- as a step it timed out at 15 min on every PR.

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Mark repo safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Task
        run: sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Build
        run: task build

      - name: Test
        run: task test

      - name: Lint
        run: task lint

      - name: Check desktop version sync
        run: task check:versions
