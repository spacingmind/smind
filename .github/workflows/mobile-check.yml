name: mobile-check

# PR gate for the mobile app's relay client: typecheck, the unit suite, and
# the integration suites that drive a real Go relay + daemon hub (the relay
# devharness) from node. Nothing here needs Expo, a simulator or a secret.
# The Go relay is under test too (the client speaks E2EE v2 to it, ADR-0035),
# so a change under internal/relay/ runs these as well.
#
# The check is required on develop, so it runs on every PR and reports
# success straight away when nothing under the paths below changed (a
# path-filtered required check would leave unrelated PRs waiting forever).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: typecheck, unit, integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Detect mobile or relay changes
        id: changes
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/$BASE_REF...HEAD" |
            grep -qE '^(mobile/|internal/relay/|\.github/workflows/mobile-check\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No mobile/ or internal/relay/ changes; nothing to check."
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.changes.outputs.relevant == 'true'
        with:
          go-version-file: go.mod

      - name: npm ci
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.relevant == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.changes.outputs.relevant == 'true'
        run: npm test

      # The integration tests build and start the devharness themselves and give
      # it a bounded time to come up; on a cold runner the module download and
      # compile alone can eat that, so build it once up front (the same warm-up
      # desktop-check does for the relay harness). The build is discarded: only
      # the Go build cache matters.
      - name: Warm the Go build cache for the relay devharness
        if: steps.changes.outputs.relevant == 'true'
        working-directory: .
        run: go build -o "$RUNNER_TEMP/devharness" ./internal/relay/bridge/devharness

      # Sets NODE_TLS_REJECT_UNAUTHORIZED=0 for this process only (the harness's relay
      # serves a self-signed certificate) and SMIND_REQUIRE_PASSWORD_HARNESS=1 so a
      # harness without -password fails the run instead of skipping the password suite.
      - name: Integration tests (live Go devharness)
        if: steps.changes.outputs.relevant == 'true'
        run: npm run test:integration
