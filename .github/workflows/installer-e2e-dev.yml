name: installer-e2e-dev
# TEMPORARY dev loop for desktop/scripts/installer-e2e.ps1 (deleted before the PR is final).
on:
  pull_request:
    paths:
      - ".github/workflows/installer-e2e-dev.yml"
      - "desktop/scripts/installer-e2e.ps1"
      - "desktop/scripts/cdp-invoke.mjs"
permissions:
  contents: read
env:
  # A desktop-windows.yml run on this branch whose artifact `smind-desktop-windows` holds the freshly built installers.
  BUILD_RUN_ID: "39104349151"
jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download the installers built by $BUILD_RUN_ID
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download $env:BUILD_RUN_ID --repo ${{ github.repository }} -n smind-desktop-windows -D installers
      - name: installer e2e
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem installers -Filter *-setup.exe | Select-Object -First 1).FullName
          ./desktop/scripts/installer-e2e.ps1 -NewInstaller $setup
