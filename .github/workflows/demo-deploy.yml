name: demo-deploy

# ADR-0051 option (a): deploys the web demo (web/packages/ui `build:demo` -> dist-demo) to Cloudflare as the static-assets
# Worker `smind-demo` on app.spacingmind.com (web/packages/ui/wrangler.demo.jsonc).
#
#   - A published release deploys that release's tag.
#   - A manual run deploys any ref (default develop), so the demo can go live between releases:
#         gh workflow run demo-deploy.yml -f ref=develop
#
# The two repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are the Human's (docs/decisions/0051, section 9).
# Without either of them the run prints a notice and ends green without building or deploying anything.
# The demo build is checked before it is uploaded: forbidden strings, the CSP and the size budget (check-demo-build.mjs).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to deploy"
        type: string
        default: develop

permissions:
  contents: read

# One deploy at a time, and a running deploy is never cancelled half-way: a later one waits its turn.
concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The secrets are mapped into the one step that needs them, never into the job: the build steps below run package
      # install scripts and must not see the token. Nothing here prints a secret, only whether it is set.
      - name: Check the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=demo-deploy skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not set in this repository's secrets, so nothing was built or deployed. Add both (ADR-0051 section 9), then run: gh workflow run demo-deploy.yml -f ref=develop"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.secrets.outputs.present == 'true'
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.secrets.outputs.present == 'true'

      - name: Install web dependencies
        if: steps.secrets.outputs.present == 'true'
        run: cd web && bun install --frozen-lockfile

      # tsc, the production-independent demo build, and its check (forbidden strings, CSP and script hash, lazy chunk, budget).
      - name: Build the demo
        if: steps.secrets.outputs.present == 'true'
        run: cd web && bun run --filter @smind/ui build:demo

      - name: Check the demo build
        if: steps.secrets.outputs.present == 'true'
        run: cd web/packages/ui && node scripts/check-demo-build.mjs dist-demo

      # wrangler is pinned; the token and account id exist only in this step's environment.
      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.present == 'true'
        working-directory: web/packages/ui
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: bunx wrangler@4.156.0 deploy --config wrangler.demo.jsonc
