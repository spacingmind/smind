# Builds the docs site (docs-site/, VitePress, reads public-docs/) and deploys it to Cloudflare as the static-assets Worker
# `smind-docs` on docs.spacingmind.com (docs-site/wrangler.docs.jsonc). It used to be GitHub Pages (docs-pages.yml).
#
# What runs when:
#   - A pull request, and a push to develop on the docs paths: build, test and check the built pages only. Broken docs are caught
#     early; nothing is deployed.
#   - A release: release-please.yml calls this workflow (workflow_call) with ref = the new tag, once the release is published, so
#     production always matches the released version. (A `release: published` trigger would never fire: release-please publishes with
#     the default GITHUB_TOKEN, and events made with it start no workflows.) The version line comes from the manifest at that tag.
#   - By hand, for any ref: gh workflow run docs-deploy.yml -f ref=v0.18.0
#
# The two repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are the Human's (ADR-0051, section 9; the same pair
# deploys the demo). Without either of them the site is still built and checked, and the deploy step is skipped with a notice.
name: docs-deploy

on:
  push:
    branches: [develop]
    paths:
      - "public-docs/**"
      - "docs-site/**"
      - ".github/workflows/docs-deploy.yml"
      - ".release-please-manifest.json"
  pull_request:
    paths:
      - "public-docs/**"
      - "docs-site/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_call:
    inputs:
      ref:
        description: "Tag, branch or commit to build and deploy"
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or commit to build and deploy"
        type: string
        default: develop

permissions:
  contents: read

# One deploy at a time, and a running deploy is never cancelled half-way: a later one waits its turn.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `inputs.ref` is set by workflow_call and workflow_dispatch and empty for a push or a pull request: that is the whole
      # difference between "deploy this ref" and "just build and check".
      - name: Decide whether this run deploys
        id: mode
        env:
          REF_INPUT: ${{ inputs.ref }}
        run: |
          if [ -n "$REF_INPUT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "This run builds and checks only; docs deploy when a release is cut, or by hand: gh workflow run docs-deploy.yml -f ref=<tag>"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # lastUpdated reads git history
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install
        working-directory: docs-site
        run: npm ci
      - name: Test
        working-directory: docs-site
        run: npm test
      - name: Build
        working-directory: docs-site
        run: npm run build
      - name: Check built pages
        working-directory: docs-site
        run: node scripts/check-dist.mjs

      # Everything below runs only for a deploy. The secrets are mapped into the one step that checks them and the one that
      # deploys, never into the job: the install and build steps above run package scripts and must not see the token. Nothing
      # prints a secret, only whether it is set.
      - name: Check the Cloudflare secrets
        id: secrets
        if: steps.mode.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=docs-deploy skipped the deploy::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not set in this repository's secrets, so the site was built and checked but not deployed. Add both (ADR-0051 section 9), then run: gh workflow run docs-deploy.yml -f ref=<tag>"
          fi

      # wrangler is pinned; the token and account id exist only in this step's environment.
      - name: Deploy to Cloudflare
        if: steps.mode.outputs.deploy == 'true' && steps.secrets.outputs.present == 'true'
        working-directory: docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.156.0 deploy --config wrangler.docs.jsonc
