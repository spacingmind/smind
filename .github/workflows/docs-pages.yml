# Builds the docs site (docs-site/, VitePress, reads public-docs/) and deploys
# it to GitHub Pages at docs.spacingmind.com. A pull request only builds.
# Pages must be enabled by hand (Settings -> Pages -> Source: GitHub Actions).
name: docs-pages

on:
  push:
    branches: [develop]
    paths:
      - "public-docs/**"
      - "docs-site/**"
      - ".github/workflows/docs-pages.yml"
      - ".release-please-manifest.json"
  pull_request:
    paths:
      - "public-docs/**"
      - "docs-site/**"
      - ".github/workflows/docs-pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # lastUpdated reads git history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install
        working-directory: docs-site
        run: npm ci
      - name: Test
        working-directory: docs-site
        run: npm test
      - name: Build
        working-directory: docs-site
        run: npm run build
      - name: Check built pages
        working-directory: docs-site
        run: node scripts/check-dist.mjs
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
