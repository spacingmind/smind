name: e2e

# Playwright suite for the web UI (web/e2e). Non-required on PRs and NOT on the
# merge queue (the queue runs only `ci`); the nightly runs the full matrix.
on:
  pull_request:
    paths:
      - "web/**"
      - "cmd/**"
      - "internal/wsapi/**"
      - "internal/server/**"
      - "internal/runs/**"
      - "internal/workspace/**"
      - "internal/taskrunner/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full matrix (all four projects, @flaky specs included)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 12 || 35 }}
    env:
      CI: "true"
      E2E_FULL: ${{ (github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.full) && '1') || '' }}
      SMIND_BIN: ${{ github.workspace }}/bin/smind
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Mark repo safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Task
        run: sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Node version (runs the fake agent)
        run: node --version

      # Writes bin/smind with the web UI embedded (Taskfile.yml build).
      - name: Build
        run: task build

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install Chromium
        run: cd web/e2e && bunx playwright install --with-deps chromium

      - name: Flake report tests
        run: node --test web/e2e/scripts/*.test.mjs

      # PRs skip quarantined specs (@flaky); the nightly runs everything.
      - name: Playwright
        run: cd web/e2e && bunx playwright test --workers=2 ${{ github.event_name == 'pull_request' && '--grep-invert @flaky' || '' }}

      - name: Job summary
        if: always()
        run: node web/e2e/scripts/flake-report.mjs --summary web/e2e/test-results >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failures-${{ github.run_id }}
          path: web/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-timing-${{ github.run_id }}
          path: |
            web/e2e/test-results/results.json
            web/e2e/test-results/flaky.json
          retention-days: 30
          if-no-files-found: ignore

  nightly-issue:
    name: nightly-issue
    needs: e2e
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the nightly issue
        run: |
          gh label create e2e-nightly --color B60205 --description "Nightly e2e run failed" || true
          number=$(gh issue list --label e2e-nightly --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Nightly e2e failed again: $RUN_URL"
          else
            gh issue create --label e2e-nightly --title "Nightly e2e failed" --body "The nightly e2e run failed: $RUN_URL"
          fi
