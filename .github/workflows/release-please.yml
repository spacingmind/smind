# Runs on every push to `develop`, the single integration branch (see
# CONTRIBUTING.md and docs/release-model-review.md for why the old
# release-only `master` + sync-back model was dropped: it stalled the
# pipeline for real -- sync-develop's own merge commits made develop
# un-rebaseable, forcing a 125-commit squash promotion that left
# release-please blind, "No user facing commits", 187 commits stuck).
#
# release-please inspects Conventional Commits (feat:/fix:/BREAKING CHANGE)
# accumulated since the last release, and either:
#   - opens/updates a "chore(develop): release X.Y.Z" PR against `develop`
#     containing the version bump + CHANGELOG.md, or
#   - once that release PR is merged, creates the vX.Y.Z git tag and a
#     GitHub Release -- both on `develop`, where the commits live.
#     The release commit can't be clobbered by a later promotion (there
#     are no promotions anymore), which is why sync-develop.yml and
#     ci.yml's release-metadata guard are gone.
#
# When it does create a release, the jobs below build cross-platform smind
# daemon binaries (linux/darwin x amd64/arm64, CGO_ENABLED=0, web UI
# embedded), the Windows desktop installers and the macOS .dmg per arch (by
# calling desktop-windows.yml / desktop-macos.yml as reusable workflows; both
# apps bundle the matching daemon built here), package everything with a
# SHA-256 checksums.txt (signed with the desktop-updater minisign key as
# checksums.txt.minisig, ADR-0031 P7), and attach it all to that Release. No
# OS code signing/notarization (out of scope); the Windows daemon ships as
# smind_<version>_windows_{amd64,arm64}.zip. Modeled on
# refs/cliproxyapi's release workflow, adapted to release-please already
# owning tag/Release creation.
#
# workflow_dispatch runs the exact same build+package+checksum steps as a
# dry run: it never touches a Release, it only publishes the results as
# workflow artifacts. Used to prove the pipeline out on a branch -- see
# docs/plans/completed/release-binaries.md's Validation section for a
# recorded run.
name: release-please

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Computes the version/commit to stamp into binaries, and gates every job
  # below on "this is either a real release, or a workflow_dispatch dry
  # run" -- `always()` is required because release-please above is itself
  # skipped on workflow_dispatch (it only runs on push).
  prepare:
    needs: release-please
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - id: v
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short HEAD)"
          if [ "${{ needs.release-please.outputs.release_created }}" = "true" ]; then
            version="${{ needs.release-please.outputs.tag_name }}"
            version="${version#v}"
          else
            version="$(jq -r '.["."]' .release-please-manifest.json)-dev+$commit"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    # Skip cascades transitively through `needs` by default (prepare
    # itself needs release-please, which is skipped on workflow_dispatch),
    # even though prepare succeeded -- always() + an explicit check breaks
    # that cascade the same way it does for prepare and publish below.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Task
        run: sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Build web UI
        run: task build:web

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          name="smind_${VERSION}_${GOOS}_${GOARCH}"
          archive_dir="dist/${name}/archive"
          mkdir -p "$archive_dir"

          go build -buildvcs=false \
            -ldflags "-X github.com/spacingmind/smind/internal/version.Version=$VERSION -X github.com/spacingmind/smind/internal/version.Commit=$COMMIT" \
            -o "$archive_dir/smind" ./cmd/smind

          cp LICENSE "$archive_dir/"
          # Windows assets are .zip with smind.exe at the archive root; the
          # tar.gz layout (smind + LICENSE) is kept as-is for linux/darwin.
          if [ "$GOOS" = "windows" ]; then
            mv "$archive_dir/smind" "$archive_dir/smind.exe"
            (cd "$archive_dir" && zip -X "../../${name}.zip" smind.exe LICENSE)
          else
            tar -C "$archive_dir" -czf "dist/${name}.tar.gz" smind LICENSE
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smind_${{ needs.prepare.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # First-run evidence for the native Windows daemon binaries (AC9,
  # docs/plans/active/windows-daemon-runtime-parity.md): unzip each asset
  # on a real Windows runner of the matching arch and smoke-test
  # `smind.exe version`. Independent of `publish` on purpose: publish
  # stays gated exactly as before, and a verification failure is visible
  # as a red job here instead of blocking asset upload.
  verify-windows-amd64:
    needs: [prepare, build-binaries]
    if: always() && needs.build-binaries.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smind_${{ needs.prepare.outputs.version }}_windows_amd64
          path: dist

      - name: Unzip and run smind.exe version
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath run
          if (-not (Test-Path run/smind.exe)) { throw 'smind.exe not at archive root' }
          $out = & run/smind.exe version
          $out
          if (-not ($out -match [regex]::Escape($env:VERSION))) {
            throw "smind.exe version output did not contain $env:VERSION"
          }

  # Same smoke test on GitHub's hosted ARM64 Windows runner, plus the
  # first-ever native ARM64 run of the ConPTY terminal tests.
  # continue-on-error: the `windows-11-arm` runner label is not available
  # in every org/plan yet; when it isn't, this job fails to be queued and
  # must not fail the whole workflow run. The result is recorded in the
  # run's job summary either way so a silent skip is impossible.
  verify-windows-arm64:
    needs: [prepare, build-binaries]
    if: always() && needs.build-binaries.result == 'success'
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smind_${{ needs.prepare.outputs.version }}_windows_arm64
          path: dist

      - name: Unzip and run smind.exe version
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath run
          if (-not (Test-Path run/smind.exe)) { throw 'smind.exe not at archive root' }
          $out = & run/smind.exe version
          $out
          if (-not ($out -match [regex]::Escape($env:VERSION))) {
            throw "smind.exe version output did not contain $env:VERSION"
          }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: go test ./internal/terminal/... (native ARM64)
        run: go test ./internal/terminal/...

      - name: Record result in job summary
        if: always()
        shell: bash
        run: |
          r='${{ job.status }}'
          if [ "$r" = 'success' ]; then
            echo '### verify-windows-arm64: PASS (native ARM64 smind.exe version + internal/terminal tests)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### verify-windows-arm64: $r -- ARM64 verification did not pass (see this job's steps; possibly the windows-11-arm runner is unavailable in this org)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The Windows app bundles the windows/amd64 daemon (ADR-0030 amendment), so
  # like the macOS one it waits for build-binaries and reuses that job's
  # artifact instead of compiling Go again. `release-please` in needs so
  # require-updater-signing can read its release_created output; the
  # always() + result checks keep the workflow_dispatch dry-run path working
  # when release-please is skipped.
  build-desktop-windows:
    needs: [release-please, prepare, build-binaries]
    if: always() && needs.prepare.result == 'success' && needs.build-binaries.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-windows.yml
    with:
      daemon-version: ${{ needs.prepare.outputs.version }}
      require-updater-signing: ${{ needs.release-please.outputs.release_created == 'true' }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  # The macOS app bundles the darwin daemon, so it waits for build-binaries
  # and reuses that job's per-arch artifact instead of compiling Go again.
  build-desktop-macos:
    needs: [release-please, prepare, build-binaries]
    if: always() && needs.prepare.result == 'success' && needs.build-binaries.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-macos.yml
    with:
      daemon-version: ${{ needs.prepare.outputs.version }}
      require-updater-signing: ${{ needs.release-please.outputs.release_created == 'true' }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  # Collects every build's artifact, computes one checksums.txt over all of
  # them, and (on a real release only) attaches everything to the Release.
  # `always()` is required for the same reason as in `prepare`: on a
  # workflow_dispatch dry run, `release-please` is skipped, and by default
  # a skipped dependency would skip this job too.
  publish:
    needs: [release-please, prepare, build-binaries, build-desktop-windows, build-desktop-macos]
    if: |
      always() &&
      needs.build-binaries.result == 'success' &&
      needs.build-desktop-windows.result == 'success' &&
      needs.build-desktop-macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # checkout must come BEFORE download-artifact: it cleans untracked
      # files, which would wipe the downloaded dist/ artifacts.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.tar.gz *.zip *.exe *.msi *.dmg *.sig)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "expected release assets, found none" >&2
            exit 1
          fi
          sha256sum "${files[@]}" | sort -k2 > checksums.txt

      # Signs checksums.txt (ADR-0031 P7) so `smind update` can tell a genuine
      # release from one whose archives AND checksums.txt were swapped. Same
      # minisign key as the desktop updater (ADR-0023); smind embeds the public
      # half (internal/selfupdate.UpdaterPublicKey, pinned to tauri.conf.json by
      # a test). Must come after "Checksums" and before anything is uploaded.
      - name: Install the Tauri CLI (version pinned by desktop/package-lock.json)
        run: npm ci --prefix desktop --ignore-scripts # no install scripts may run before the signing step

      - name: Install minisign (independent check of every signature we make)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # Real release: the release key is mandatory (a missing secret fails the
      # job, never publishes unsigned -- ADR-0023 §4) and the new signature is
      # re-verified against the public key committed in tauri.conf.json. The
      # key goes through the environment only; nothing here prints it.
      - name: Sign checksums.txt (release key)
        if: needs.release-please.outputs.release_created == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: refusing to publish a release without a signed checksums.txt"
            exit 1
          fi
          SMIND_SIGN_PUBKEY="$(jq -r .plugins.updater.pubkey desktop/src-tauri/tauri.conf.json)"
          export SMIND_SIGN_PUBKEY
          scripts/sign-checksums.sh dist "$VERSION"

      # workflow_dispatch dry run: prove the signing pipeline with a throwaway
      # key generated here. The real secret is not referenced by this step, so
      # a dry run can never sign (or leak) with it; the signature in the dry-run
      # artifact is by a key nobody trusts.
      - name: Sign checksums.txt (dry run, throwaway key)
        if: needs.release-please.outputs.release_created != 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/dryrun-signing.key"
          desktop/node_modules/.bin/tauri signer generate -w "$key" -p "" -f >/dev/null
          SMIND_SIGN_PUBKEY="$(cat "$key.pub")"
          export SMIND_SIGN_PUBKEY
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" \
            scripts/sign-checksums.sh dist "$VERSION"
          rm -f "$key" "$key.pub"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smind_${{ needs.prepare.outputs.version }}_release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.sig
            dist/checksums.txt
            dist/checksums.txt.minisig
          if-no-files-found: error

      - name: Upload to Release
        if: needs.release-please.outputs.release_created == 'true'
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(*.tar.gz *.zip *.exe *.msi *.dmg *.sig)
          gh release upload "$TAG" "${assets[@]}" --clobber --repo "${{ github.repository }}"
          # smind update reads checksums.txt first and then its signature: upload
          # the signature before checksums.txt so a client never sees one
          # without the other and mistakes the gap for "release has no signature".
          gh release upload "$TAG" checksums.txt.minisig --clobber --repo "${{ github.repository }}"
          gh release upload "$TAG" checksums.txt --clobber --repo "${{ github.repository }}"

      # Must come after the asset upload above: latest.json references the
      # other release assets, and clients must never see a manifest that
      # points at a file that isn't there yet (ADR-0023.3). Real releases
      # only -- a workflow_dispatch dry run stamps a `-dev+<sha>` version,
      # which is not a valid stable manifest version. No secret is
      # referenced here; the manifest only needs public asset URLs.
      - name: Generate and upload latest.json
        if: needs.release-please.outputs.release_created == 'true'
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body --repo "${{ github.repository }}" > notes.md
          node ../desktop/scripts/gen-latest-json.mjs \
            --dir . \
            --version "${TAG#v}" \
            --tag "$TAG" \
            --repo "${{ github.repository }}" \
            --notes-file notes.md \
            --out latest.json
          jq -r '.platforms | to_entries[] | "\(.key): \(.value.url)"' latest.json
          gh release upload "$TAG" latest.json --clobber --repo "${{ github.repository }}"

  # Keeps `master` meaningful as "the code that has been released": after
  # a real release's assets are attached, fast-forward master to the tag.
  # `master` is never a merge target anymore (that was the old model's
  # fatal coupling), so there is nothing to sync back -- this pointer is
  # the whole job. Refuses to move master if it has diverged from the
  # tag's history rather than force anything.
  fast-forward-master:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Fast-forward master to the release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master "$TAG"; then
            echo "::error::origin/master has diverged from $TAG's history -- refusing to move it; resolve by hand"
            exit 1
          fi
          git push origin "$TAG:refs/heads/master"
          echo "master fast-forwarded to $TAG"

  # Rebuilds spacingmind.com so its download page and version badge pick up
  # the new release: the site reads releases/latest only at build time and
  # listens for `repository_dispatch: smind-release`. GITHUB_TOKEN can't
  # dispatch to another repository, so this needs LANDING_DISPATCH_TOKEN (a
  # fine-grained token with Contents: read & write on
  # spacingmind/spacing-mind-landing-page). Without the secret the job only
  # warns, so a release never fails on it.
  notify-landing:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch smind-release to the landing site
        env:
          GH_TOKEN: ${{ secrets.LANDING_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::LANDING_DISPATCH_TOKEN is not set -- spacingmind.com was not rebuilt for $TAG"
            exit 0
          fi
          gh api -X POST repos/spacingmind/spacing-mind-landing-page/dispatches \
            -f event_type=smind-release -F "client_payload[tag]=$TAG"
          echo "dispatched smind-release ($TAG) to spacingmind/spacing-mind-landing-page"
