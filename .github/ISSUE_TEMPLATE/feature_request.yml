name: Feature request
description: Suggest an addition or change to smind
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and how does smind currently fall short?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional — a sketch of the CLI/API/UI shape or behavior you have in mind.
    validations:
      required: false
