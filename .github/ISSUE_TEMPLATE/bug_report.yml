name: Bug report
description: Report a problem with smind
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the issue (CLI commands, or actions in the web UI).
      placeholder: |
        1. smind workspace create ...
        2. Open the web UI, select the task, click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: smind-version
    attributes:
      label: smind version
      placeholder: e.g. v0.2.0, or a commit SHA (smind daemon prints this on startup)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Daemon logs, browser console errors (for web UI issues), provider/account involved, environment details, etc.
    validations:
      required: false
